name: Release
# Push a tag like v0.2.0 to publish to PyPI (trusted publishing, no token stored) and GHCR.
# One-time setup: on pypi.org add a "pending publisher" for this repo, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: Tag matches package version
        run: test "v$(uv run python -c 'import importlib.metadata as m; print(m.version("clarikube"))')" = "$GITHUB_REF_NAME"
      - name: server.json matches package version
        run: python3 -c "import json,tomllib;v=tomllib.load(open('pyproject.toml','rb'))['project']['version'];d=json.load(open('server.json'));assert d['version']==v==d['packages'][0]['version'],(v,d['version'])"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clarikube:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/clarikube:latest
  mcp-registry:
    # Listed on registry.modelcontextprotocol.io as io.github.007jesser/clarikube (needs the PyPI package first).
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Wait for PyPI to serve the new version
        run: for i in $(seq 1 30); do curl -sf "https://pypi.org/pypi/clarikube/${GITHUB_REF_NAME#v}/json" >/dev/null && exit 0; sleep 10; done; exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
