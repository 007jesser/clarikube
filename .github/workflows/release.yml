name: Release
# Push a tag like v0.2.0 to publish to PyPI (trusted publishing, no token stored) and GHCR.
# One-time setup: on pypi.org add a "pending publisher" for this repo, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: Tag matches package version
        run: test "v$(uv run python -c 'import importlib.metadata as m; print(m.version("kubepilot"))')" = "$GITHUB_REF_NAME"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubepilot:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/kubepilot:latest
