name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check src tests lab scripts
      - run: uv run ruff format --check src tests lab scripts
      - run: uv run mypy
      - run: uv run pytest
      - name: Demo fixture is up to date with its generator
        run: uv run python scripts/gen_ops_fixture.py | diff - src/kubemedic/demo/cluster/ops.yaml
      - name: Build and smoke-test the wheel like a PyPI user
        run: |
          uv build
          cd "$(mktemp -d)"
          uvx --from "$GITHUB_WORKSPACE"/dist/*.whl kubemedic demo
