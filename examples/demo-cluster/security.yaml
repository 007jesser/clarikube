# ---------------------------------------------------------------- RBAC
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: payment-api, namespace: shop}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: payment-api, namespace: shop}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: payment-api}
subjects:
  - {kind: ServiceAccount, name: payment-api, namespace: shop}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: cluster-admin}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: cluster-admin}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects:
  - {kind: Group, name: "system:masters"}
---
# ---------------------------------------------------------------- NetworkPolicies (payment-api is NOT covered)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: frontend-allow, namespace: shop}
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: backend-allow, namespace: shop}
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [checkout, api, worker]}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: frontend}}}]
  egress:
    - {}
---
