# In-cluster mode: Falco alert receiver + MCP server (Streamable HTTP) sharing one SQLite volume.
# Apply after rbac.yaml. Create the ingest token first:
#   kubectl -n clarikube create secret generic clarikube-ingest --from-literal=token=$(openssl rand -hex 24)
# Connect your MCP client through a port-forward (the MCP port is not exposed outside the cluster):
#   kubectl -n clarikube port-forward svc/clarikube 8765:8765   ->  http://127.0.0.1:8765/mcp
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clarikube
  namespace: clarikube
  labels: {app.kubernetes.io/name: clarikube}
spec:
  replicas: 1          # SQLite alert store: keep a single replica
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: clarikube}
  template:
    metadata:
      labels: {app.kubernetes.io/name: clarikube}
    spec:
      serviceAccountName: clarikube
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ingest
          image: ghcr.io/007jesser/clarikube:0.2.0   # build with the repo Dockerfile
          args: [ingest, --host, 0.0.0.0, --port, "2801"]
          env:
            - {name: CLARIKUBE_ALERTS_DB, value: /data/alerts.db}
            - name: CLARIKUBE_INGEST_TOKEN
              valueFrom: {secretKeyRef: {name: clarikube-ingest, key: token}}
          ports: [{name: ingest, containerPort: 2801}]
          readinessProbe: {httpGet: {path: /healthz, port: ingest}}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext: &hardened
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: data, mountPath: /data}]
        - name: mcp
          image: ghcr.io/007jesser/clarikube:0.2.0
          args: [serve, --transport, http, --host, 0.0.0.0, --port, "8765"]
          env:
            - {name: CLARIKUBE_SOURCE, value: kube}
            - {name: CLARIKUBE_ALERTS_DB, value: /data/alerts.db}
            - {name: CLARIKUBE_ALLOWLIST, value: /config/allowlist.yaml}
            - {name: CLARIKUBE_STATE_DIR, value: /data/state}
          ports: [{name: mcp, containerPort: 8765}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext: *hardened
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          emptyDir: {}            # use a PVC to keep alert history across restarts
        - name: tmp
          emptyDir: {}
        - name: config
          configMap: {name: clarikube-config, optional: true}
---
apiVersion: v1
kind: Service
metadata:
  name: clarikube
  namespace: clarikube
spec:
  selector: {app.kubernetes.io/name: clarikube}
  ports:
    - {name: ingest, port: 2801, targetPort: ingest}
    - {name: mcp, port: 8765, targetPort: mcp}
---
# Only Falcosidekick may reach the ingest port; the MCP port is reachable only via port-forward.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clarikube
  namespace: clarikube
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: clarikube}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: falco}
      ports: [{port: 2801}]
