# Minimal READ-ONLY access for kubemedic.
# - no Secrets, no pods/exec, no write verbs anywhere; pods/log and configmaps only in optional roles below
# - RBAC objects are listed only to compute ServiceAccount exposure
apiVersion: v1
kind: Namespace
metadata:
  name: kubemedic
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubemedic
  namespace: kubemedic
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubemedic-readonly
rules:
  - apiGroups: [""]
    resources: [pods, events, nodes, namespaces, services, serviceaccounts, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [aquasecurity.github.io]
    resources: [vulnerabilityreports, configauditreports]
    verbs: [get, list, watch]
  # Operator resources for component health (only read if those operators are installed)
  - apiGroups: [kafka.strimzi.io]
    resources: [kafkas, kafkanodepools]
    verbs: [get, list, watch]
  - apiGroups: [rabbitmq.com]
    resources: [rabbitmqclusters]
    verbs: [get, list, watch]
  - apiGroups: [opensearch.org, opensearch.opster.io]
    resources: [opensearchclusters]
    verbs: [get, list, watch]
  - apiGroups: [elasticsearch.k8s.elastic.co]
    resources: [elasticsearches]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch]
  - apiGroups: [acid.zalan.do]
    resources: [postgresqls]
    verbs: [get, list, watch]
  - apiGroups: [mongodbcommunity.mongodb.com]
    resources: [mongodbcommunity]
    verbs: [get, list, watch]
  - apiGroups: [redis.redis.opstreelabs.in]
    resources: [redisclusters, redisreplications]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch]
  - apiGroups: [configuration.konghq.com]
    resources: [kongplugins, kongclusterplugins]
    verbs: [get, list, watch]
  # Status of platform tools, read only if installed. NOTE: ExternalSecret/SealedSecret objects hold references
  # and encrypted blobs, never plaintext secret values; kubemedic reads only their status and target names.
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, watch]
  - apiGroups: [kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io, source.toolkit.fluxcd.io]
    resources: [kustomizations, helmreleases, gitrepositories, helmrepositories, ocirepositories]
    verbs: [get, list, watch]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, secretstores, clustersecretstores]
    verbs: [get, list, watch]
  - apiGroups: [bitnami.com]
    resources: [sealedsecrets]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheuses, alertmanagers]
    verbs: [get, list, watch]
  - apiGroups: [keda.sh]
    resources: [scaledobjects, scaledjobs]
    verbs: [get, list, watch]
  - apiGroups: [karpenter.sh]
    resources: [nodepools, nodeclaims]
    verbs: [get, list, watch]
  - apiGroups: [longhorn.io]
    resources: [volumes]
    verbs: [get, list, watch]
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters]
    verbs: [get, list, watch]
  - apiGroups: [kyverno.io]
    resources: [clusterpolicies, policies]
    verbs: [get, list, watch]
  - apiGroups: [wgpolicyk8s.io]
    resources: [policyreports, clusterpolicyreports]
    verbs: [get, list, watch]
  - apiGroups: [velero.io]
    resources: [backups, schedules, backupstoragelocations]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubemedic-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubemedic-readonly
subjects:
  - kind: ServiceAccount
    name: kubemedic
    namespace: kubemedic
---
# OPTIONAL: lets kubemedic read the last lines of failing containers' logs (KUBEMEDIC_READ_LOGS=true).
# Logs are untrusted input: kubemedic only extracts known error signatures and sanitizes them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubemedic-logs
rules:
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubemedic-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubemedic-logs
subjects:
  - kind: ServiceAccount
    name: kubemedic
    namespace: kubemedic
---
# OPTIONAL: lets kubemedic read the ConfigMaps of the platform components it checks (Fluent Bit outputs and
# buffers, ingress-nginx/ModSecurity settings). kubemedic only GETs ConfigMaps mounted by those pods, parses
# them in memory and never returns their contents (they can embed credentials).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubemedic-config
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubemedic-config
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubemedic-config
subjects:
  - kind: ServiceAccount
    name: kubemedic
    namespace: kubemedic
