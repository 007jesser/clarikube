# Minimal READ-ONLY access for kubepilot.
# - no Secrets, no pods/exec, no pods/log, no write verbs anywhere
# - RBAC objects are listed only to compute ServiceAccount exposure
apiVersion: v1
kind: Namespace
metadata:
  name: kubepilot
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubepilot
  namespace: kubepilot
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubepilot-readonly
rules:
  - apiGroups: [""]
    resources: [pods, events, nodes, namespaces, services, serviceaccounts, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [aquasecurity.github.io]
    resources: [vulnerabilityreports, configauditreports]
    verbs: [get, list, watch]
  # Operator resources for component health (only read if those operators are installed)
  - apiGroups: [kafka.strimzi.io]
    resources: [kafkas, kafkanodepools]
    verbs: [get, list, watch]
  - apiGroups: [rabbitmq.com]
    resources: [rabbitmqclusters]
    verbs: [get, list, watch]
  - apiGroups: [opensearch.opster.io]
    resources: [opensearchclusters]
    verbs: [get, list, watch]
  - apiGroups: [elasticsearch.k8s.elastic.co]
    resources: [elasticsearches]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch]
  - apiGroups: [acid.zalan.do]
    resources: [postgresqls]
    verbs: [get, list, watch]
  - apiGroups: [mongodbcommunity.mongodb.com]
    resources: [mongodbcommunity]
    verbs: [get, list, watch]
  - apiGroups: [redis.redis.opstreelabs.in]
    resources: [redisclusters, redisreplications]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubepilot-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubepilot-readonly
subjects:
  - kind: ServiceAccount
    name: kubepilot
    namespace: kubepilot
---
# OPTIONAL: lets kubepilot read the last lines of failing containers' logs (KUBEPILOT_READ_LOGS=true).
# Logs are untrusted input: kubepilot only extracts known error signatures and sanitizes them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubepilot-logs
rules:
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubepilot-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubepilot-logs
subjects:
  - kind: ServiceAccount
    name: kubepilot
    namespace: kubepilot
