# Requests far more memory than the node has -> Pending / Unschedulable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 50m
              memory: 64Gi
            limits:
              memory: 64Gi
