# Redis: protected mode off, no password, no persistence, exposed on a NodePort.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: data
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: cache}
spec:
  replicas: 1
  serviceName: cache
  selector:
    matchLabels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: cache}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: cache}
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          args: ["--protected-mode", "no"]
          ports:
            - containerPort: 6379
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: data
spec:
  selector: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: cache}
  ports:
    - {name: redis, port: 6379}
---
apiVersion: v1
kind: Service
metadata:
  name: cache-public
  namespace: data
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: cache}
  ports:
    - {name: redis, port: 6379}
