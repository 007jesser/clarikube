# RabbitMQ: 2 members (even count), no PodDisruptionBudget, management UI on a NodePort.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: queue
  namespace: data
  labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/instance: queue}
spec:
  replicas: 2
  serviceName: queue
  selector:
    matchLabels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/instance: queue}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/instance: queue}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            tcpSocket: {port: 5672}
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: queue
  namespace: data
spec:
  selector: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/instance: queue}
  ports:
    - {name: amqp, port: 5672}
---
apiVersion: v1
kind: Service
metadata:
  name: queue-mgmt
  namespace: data
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/instance: queue}
  ports:
    - {name: management, port: 15672}
