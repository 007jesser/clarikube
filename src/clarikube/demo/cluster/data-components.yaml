# ================================================================ Redis (Bitnami Helm chart): no password, no persistence
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache-redis-master
  namespace: data
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: cache, app.kubernetes.io/component: master, app.kubernetes.io/managed-by: Helm, helm.sh/chart: redis-19.6.0}
spec:
  replicas: 1
  serviceName: cache-redis-headless
  selector: {matchLabels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: cache, app.kubernetes.io/component: master}}
  template:
    metadata: {labels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: cache, app.kubernetes.io/component: master}}
    spec:
      containers:
        - name: redis
          image: docker.io/bitnami/redis:7.2.5
          ports: [{containerPort: 6379}]
          env:
            - {name: ALLOW_EMPTY_PASSWORD, value: "yes"}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 512Mi}}
          readinessProbe: {exec: {command: [redis-cli, ping]}}
      volumes:
        - {name: redis-data, emptyDir: {}}
status: {replicas: 1, readyReplicas: 1}
---
apiVersion: v1
kind: Pod
metadata:
  name: cache-redis-master-0
  namespace: data
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: cache, app.kubernetes.io/component: master, statefulset.kubernetes.io/pod-name: cache-redis-master-0}
  ownerReferences: [{apiVersion: apps/v1, kind: StatefulSet, name: cache-redis-master, controller: true}]
spec:
  nodeName: kind-worker2
  containers:
    - name: redis
      image: docker.io/bitnami/redis:7.2.5
      env:
        - {name: ALLOW_EMPTY_PASSWORD, value: "yes"}
      resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 512Mi}}
  volumes:
    - {name: redis-data, emptyDir: {}}
status:
  phase: Running
  containerStatuses:
    - {name: redis, ready: true, restartCount: 0, state: {running: {startedAt: "2026-10-19T10:00:00Z"}}}
---
apiVersion: v1
kind: Service
metadata: {name: cache-redis-master, namespace: data}
spec: {type: ClusterIP, selector: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: cache, app.kubernetes.io/component: master}, ports: [{name: tcp-redis, port: 6379}]}
---
