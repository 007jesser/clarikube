# ================================================================ OpenSearch: heap = limit, security off, public LB
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: search
  namespace: data
  labels: {app: search}
spec:
  replicas: 1
  serviceName: search-headless
  selector: {matchLabels: {app: search}}
  template:
    metadata: {labels: {app: search}}
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.13.0
          ports: [{containerPort: 9200}, {containerPort: 9300}]
          env:
            - {name: discovery.type, value: single-node}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms1g -Xmx1g"}
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {memory: 1Gi}}
          readinessProbe: {tcpSocket: {port: 9200}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
status: {replicas: 1, readyReplicas: 0}
---
apiVersion: v1
kind: Pod
metadata:
  name: search-0
  namespace: data
  labels: {app: search, statefulset.kubernetes.io/pod-name: search-0}
  ownerReferences: [{apiVersion: apps/v1, kind: StatefulSet, name: search, controller: true}]
spec:
  nodeName: kind-worker2
  containers:
    - name: opensearch
      image: opensearchproject/opensearch:2.13.0
      env:
        - {name: discovery.type, value: single-node}
        - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms1g -Xmx1g"}
        - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
      resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {memory: 1Gi}}
status:
  phase: Running
  containerStatuses:
    - name: opensearch
      ready: false
      restartCount: 6
      state: {waiting: {reason: CrashLoopBackOff}}
      lastState: {terminated: {reason: OOMKilled, exitCode: 137, startedAt: "2026-10-23T09:50:00Z", finishedAt: "2026-10-23T09:53:00Z"}}
---
apiVersion: v1
kind: List
items:
  - {apiVersion: v1, kind: PersistentVolumeClaim, metadata: {name: data-search-0, namespace: data}, spec: {resources: {requests: {storage: 10Gi}}}, status: {phase: Bound, capacity: {storage: 10Gi}}}
  - apiVersion: v1
    kind: Service
    metadata: {name: search, namespace: data}
    spec: {type: LoadBalancer, selector: {app: search}, ports: [{name: http, port: 9200}]}
---
# ================================================================ RabbitMQ (operator): 2 replicas, same node, mgmt NodePort
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata: {name: queue, namespace: data}
spec:
  replicas: 2
  image: rabbitmq:3.13-management
  resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {memory: 1Gi}}
status:
  conditions:
    - {type: AllReplicasReady, status: "True"}
    - {type: ClusterAvailable, status: "True"}
    - {type: ReconcileSuccess, status: "True"}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: queue-server
  namespace: data
  labels: {app.kubernetes.io/name: queue, app.kubernetes.io/part-of: rabbitmq}
  ownerReferences: [{apiVersion: rabbitmq.com/v1beta1, kind: RabbitmqCluster, name: queue, controller: true}]
spec:
  replicas: 2
  serviceName: queue-nodes
  selector: {matchLabels: {app.kubernetes.io/name: queue}}
  template:
    metadata: {labels: {app.kubernetes.io/name: queue, app.kubernetes.io/component: rabbitmq, app.kubernetes.io/part-of: rabbitmq}}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports: [{containerPort: 5672}, {containerPort: 15672}]
          resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {memory: 1Gi}}
          readinessProbe: {tcpSocket: {port: 5672}}
  volumeClaimTemplates:
    - metadata: {name: persistence}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
status: {replicas: 2, readyReplicas: 2}
---
apiVersion: v1
kind: Pod
metadata:
  name: queue-server-0
  namespace: data
  labels: {app.kubernetes.io/name: queue, app.kubernetes.io/component: rabbitmq, app.kubernetes.io/part-of: rabbitmq, statefulset.kubernetes.io/pod-name: queue-server-0}
  ownerReferences: [{apiVersion: apps/v1, kind: StatefulSet, name: queue-server, controller: true}]
spec:
  nodeName: kind-worker
  containers:
    - name: rabbitmq
      image: rabbitmq:3.13-management
      resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {memory: 1Gi}}
status:
  phase: Running
  containerStatuses:
    - {name: rabbitmq, ready: true, restartCount: 0, state: {running: {startedAt: "2026-10-20T10:00:00Z"}}}
---
apiVersion: v1
kind: Pod
metadata:
