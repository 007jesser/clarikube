# Data tier for the demo: operator-managed and Helm-installed middleware with realistic problems.
# ================================================================ Kafka (Strimzi 1.x, KRaft node pools): broker 2 can't get a volume
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata: {name: events, namespace: data}
spec:
  kafka:
    version: 4.3.2
    listeners:
      - {name: plain, port: 9092, type: internal, tls: false}
      - {name: external, port: 9094, type: loadbalancer, tls: false}
    config:
      default.replication.factor: 3
      min.insync.replicas: 3
      offsets.topic.replication.factor: 3
status:
  kafkaNodePools: [{name: broker}]
  conditions:
    - type: Ready
      status: "False"
      reason: TimeoutException
      message: Exceeded timeout of 300000ms while waiting for Pods resource events-broker-2 in namespace data to be ready
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: data
  labels: {strimzi.io/cluster: events}
spec:
  replicas: 3
  roles: [controller, broker]
  storage: {type: persistent-claim, size: 20Gi, class: fast-ssd}
  resources:
    requests: {cpu: 500m, memory: 2Gi}
    limits: {memory: 2Gi}
  jvmOptions: {-Xms: 1024m, -Xmx: 1024m}
status:
  replicas: 3
  nodeIds: [0, 1, 2]
  roles: [controller, broker]
---
