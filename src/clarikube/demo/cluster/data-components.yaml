  namespace: data
  labels: {app.kubernetes.io/name: queue, app.kubernetes.io/component: rabbitmq, app.kubernetes.io/part-of: rabbitmq, statefulset.kubernetes.io/pod-name: queue-server-1}
  ownerReferences: [{apiVersion: apps/v1, kind: StatefulSet, name: queue-server, controller: true}]
