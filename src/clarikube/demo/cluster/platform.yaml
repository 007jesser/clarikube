# ================================================================ Fluent Bit: ships to OpenSearch (down), drops after 1 retry, misses the control plane
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels: {app.kubernetes.io/name: fluent-bit, app.kubernetes.io/instance: fluent-bit}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: fluent-bit}}
  template:
    metadata: {labels: {app.kubernetes.io/name: fluent-bit, app.kubernetes.io/instance: fluent-bit}}
    spec:
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:3.2.2
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
      volumes:
        - {name: config, configMap: {name: fluent-bit}}
        - {name: varlog, hostPath: {path: /var/log}}
status: {desiredNumberScheduled: 2, numberReady: 2}
---
