# Platform layers around the apps: edge (ingress-nginx + ModSecurity, Kong), logging (Fluent Bit), routing, TLS.
# ================================================================ ingress-nginx: old (IngressNightmare), snippets on, WAF detect-only
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
  labels: {app.kubernetes.io/name: ingress-nginx, app.kubernetes.io/instance: ingress-nginx, app.kubernetes.io/component: controller}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: ingress-nginx, app.kubernetes.io/component: controller}}
  template:
    metadata: {labels: {app.kubernetes.io/name: ingress-nginx, app.kubernetes.io/instance: ingress-nginx, app.kubernetes.io/component: controller}}
    spec:
      containers:
        - name: controller
          image: registry.k8s.io/ingress-nginx/controller:v1.11.3@sha256:d56f135b6462cfc476447cfe564b83a45e8bb7da2774963b00d12161112270b7
          args: [/nginx-ingress-controller, --configmap=$(POD_NAMESPACE)/ingress-nginx-controller, --ingress-class=nginx, --validating-webhook=:8443]
          ports: [{containerPort: 80}, {containerPort: 443}, {containerPort: 8443}]
          resources: {requests: {cpu: 100m, memory: 90Mi}, limits: {memory: 512Mi}}
status: {replicas: 1, readyReplicas: 1}
---
apiVersion: v1
kind: Pod
metadata:
  name: ingress-nginx-controller-6b7f5d9c4-x2v8q
  namespace: ingress-nginx
  labels: {app.kubernetes.io/name: ingress-nginx, app.kubernetes.io/instance: ingress-nginx, app.kubernetes.io/component: controller, pod-template-hash: 6b7f5d9c4}
  ownerReferences: [{apiVersion: apps/v1, kind: ReplicaSet, name: ingress-nginx-controller-6b7f5d9c4, controller: true}]
spec:
  nodeName: kind-worker
  containers:
    - name: controller
      image: registry.k8s.io/ingress-nginx/controller:v1.11.3@sha256:d56f135b6462cfc476447cfe564b83a45e8bb7da2774963b00d12161112270b7
      args: [/nginx-ingress-controller, --configmap=$(POD_NAMESPACE)/ingress-nginx-controller, --ingress-class=nginx, --validating-webhook=:8443]
      resources: {requests: {cpu: 100m, memory: 90Mi}, limits: {memory: 512Mi}}
  volumes:
    - {name: webhook-cert, secret: {secretName: ingress-nginx-admission}}
status:
  phase: Running
  containerStatuses:
    - {name: controller, ready: true, restartCount: 0, state: {running: {startedAt: "2026-09-01T10:00:00Z"}}}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: ingress-nginx-controller-6b7f5d9c4
  namespace: ingress-nginx
  annotations: {deployment.kubernetes.io/revision: "1"}
  ownerReferences: [{apiVersion: apps/v1, kind: Deployment, name: ingress-nginx-controller, controller: true}]
spec:
  template:
    spec:
      containers:
        - {name: controller, image: "registry.k8s.io/ingress-nginx/controller:v1.11.3"}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: ingress-nginx-controller, namespace: ingress-nginx}
data:
  allow-snippet-annotations: "true"
  enable-modsecurity: "true"
  enable-owasp-modsecurity-crs: "true"
  use-forwarded-headers: "true"
---
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Service
    metadata: {name: ingress-nginx-controller, namespace: ingress-nginx}
    spec: {type: LoadBalancer, selector: {app.kubernetes.io/name: ingress-nginx, app.kubernetes.io/component: controller}, ports: [{name: http, port: 80}, {name: https, port: 443}]}
  - apiVersion: networking.k8s.io/v1
    kind: IngressClass
    metadata:
      name: nginx
      annotations: {ingressclass.kubernetes.io/is-default-class: "true"}
    spec: {controller: k8s.io/ingress-nginx}
  - apiVersion: networking.k8s.io/v1
    kind: IngressClass
    metadata: {name: kong}
    spec: {controller: ingress-controllers.konghq.com/kong}
---
# ================================================================ Kong: admin API on a NodePort, local rate limit with 2 pods
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-gateway
  namespace: kong
  labels: {app.kubernetes.io/name: kong, app.kubernetes.io/instance: kong}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: kong, app.kubernetes.io/instance: kong}}
  template:
    metadata: {labels: {app.kubernetes.io/name: kong, app.kubernetes.io/instance: kong}}
    spec:
      containers:
        - name: proxy
          image: kong:3.9
          env:
            - {name: KONG_DATABASE, value: "off"}
            - {name: KONG_ADMIN_LISTEN, value: "0.0.0.0:8001, 0.0.0.0:8444 ssl"}
            - {name: KONG_PROXY_LISTEN, value: "0.0.0.0:8000, 0.0.0.0:8443 ssl"}
          ports: [{containerPort: 8000}, {containerPort: 8443}, {containerPort: 8001}, {containerPort: 8444}]
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {memory: 1Gi}}
status: {replicas: 2, readyReplicas: 2}
---
