# ================================================================ Routing and TLS for the shop
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Service
    metadata: {name: frontend, namespace: shop}
    spec: {type: ClusterIP, selector: {app: frontend}, ports: [{name: http, port: 80}]}
  - apiVersion: v1
    kind: Service
    metadata: {name: orders, namespace: shop}
    spec: {type: ClusterIP, selector: {app: orders}, ports: [{name: http, port: 8080}]}
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: storefront
      namespace: shop
      annotations:
        nginx.ingress.kubernetes.io/enable-modsecurity: "false"
    spec:
      ingressClassName: nginx
      tls: [{hosts: [shop.example.com], secretName: shop-tls}]
      rules:
        - host: shop.example.com
          http:
            paths:
              - {path: /, pathType: Prefix, backend: {service: {name: frontend, port: {number: 80}}}}
              - {path: /checkout, pathType: Prefix, backend: {service: {name: checkout-svc, port: {number: 8080}}}}
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: orders-api
      namespace: shop
      annotations:
        konghq.com/plugins: rate-limit, key-auth
    spec:
      ingressClassName: kong
      rules:
        - host: api.example.com
          http:
            paths:
              - {path: /orders, pathType: Prefix, backend: {service: {name: orders, port: {number: 8080}}}}
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: shop-tls, namespace: shop}
    spec:
      secretName: shop-tls
      dnsNames: [shop.example.com]
      issuerRef: {name: letsencrypt, kind: ClusterIssuer}
    status:
      notAfter: "2026-10-26T08:00:00Z"
      renewalTime: "2026-09-26T08:00:00Z"
      conditions:
        - {type: Ready, status: "True", reason: Ready, message: Certificate is up to date and has not expired}
        - {type: Issuing, status: "True", reason: Failed, message: "The certificate request has failed to complete and will be retried: Failed to wait for order resource \"shop-tls-1-2735\" to become ready: order is in \"errored\" state: Failed to finalize Order: 429 urn:ietf:params:acme:error:rateLimited"}
