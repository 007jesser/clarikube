      nodeName: kind-worker2
      containers:
        - {name: fluent-bit, image: "cr.fluentbit.io/fluent/fluent-bit:3.2.2", resources: {limits: {memory: 128Mi}}}
      volumes:
        - {name: config, configMap: {name: fluent-bit}}
        - {name: varlog, hostPath: {path: /var/log}}
    status:
