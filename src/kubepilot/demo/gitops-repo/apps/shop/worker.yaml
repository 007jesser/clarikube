apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: worker
          image: registry.example.com/shop/worker:1.0.3
          resources:
            requests:
              cpu: 500m
              memory: 8Gi
            limits:
              memory: 8Gi
