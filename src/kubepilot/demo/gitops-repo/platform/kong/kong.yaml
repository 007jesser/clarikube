apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: kong
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: kong
    app.kubernetes.io/instance: kong
  ports:
    - name: kong-proxy
      port: 80
      targetPort: 8000
    - name: kong-proxy-tls
      port: 443
      targetPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: kong
spec:
  type: NodePort   # opened for a debugging session
  selector:
    app.kubernetes.io/name: kong
    app.kubernetes.io/instance: kong
  ports:
    - name: kong-admin
      port: 8001
      targetPort: 8001
      nodePort: 32001
